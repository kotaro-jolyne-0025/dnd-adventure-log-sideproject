<div class="page-container">
  <div class="page-header">
    <button mat-icon-button (click)="onBack()"><mat-icon>arrow_back</mat-icon></button>
    <h1 class="page-title">{{ isEditMode() ? '編輯冒險記錄' : '新增冒險記錄' }}</h1>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <!-- 📋 基本資訊 -->
    <mat-card class="form-card">
      <mat-card-header><mat-card-title>📋 基本資訊</mat-card-title></mat-card-header>
      <mat-card-content>
        <div class="field-row">
          <mat-form-field appearance="outline" class="flex-1">
            <mat-label>冒險代碼</mat-label>
            <input matInput formControlName="adventureCode" placeholder="例：CCC-GHC-BK2-07" />
          </mat-form-field>
          <mat-form-field appearance="outline" class="flex-2">
            <mat-label>冒險名稱</mat-label>
            <input matInput formControlName="adventureName" placeholder="例：死亡騎士" />
          </mat-form-field>
        </div>
        <div class="field-row">
          <mat-form-field appearance="outline" class="flex-1">
            <mat-label>遊玩日期</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="playDate" />
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
          <mat-form-field appearance="outline" class="flex-1">
            <mat-label>DM 名稱</mat-label>
            <input matInput formControlName="dmName" />
          </mat-form-field>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- 💰 資源變動 -->
    <mat-card class="form-card">
      <mat-card-header><mat-card-title>💰 資源變動</mat-card-title></mat-card-header>
      <mat-card-content>
        <p class="field-hint">所有數字欄位皆為手動填寫，不自動計算</p>

        <!-- 金幣 -->
        <div class="resource-row">
          <span class="resource-label">🪙 金幣</span>
          <mat-form-field appearance="outline" class="num-field">
            <mat-label>起始</mat-label>
            <input matInput type="number" formControlName="startingGold" />
          </mat-form-field>
          <mat-form-field appearance="outline" class="num-field">
            <mat-label>變化</mat-label>
            <input matInput type="number" formControlName="goldChange" />
          </mat-form-field>
          <mat-form-field appearance="outline" class="num-field">
            <mat-label>合計</mat-label>
            <input matInput type="number" formControlName="goldTotal" />
          </mat-form-field>
        </div>

        <!-- 休假天數 -->
        <div class="resource-row">
          <span class="resource-label">🏕️ 休假天數</span>
          <mat-form-field appearance="outline" class="num-field">
            <mat-label>起始</mat-label>
            <input matInput type="number" formControlName="startingDowntime" />
          </mat-form-field>
          <mat-form-field appearance="outline" class="num-field">
            <mat-label>變化</mat-label>
            <input matInput type="number" formControlName="downtimeChange" />
          </mat-form-field>
          <mat-form-field appearance="outline" class="num-field">
            <mat-label>合計</mat-label>
            <input matInput type="number" formControlName="downtimeTotal" />
          </mat-form-field>
        </div>

        <!-- 魔法物品 -->
        <div class="resource-row">
          <span class="resource-label">✨ 魔法物品</span>
          <mat-form-field appearance="outline" class="num-field">
            <mat-label>起始</mat-label>
            <input matInput type="number" formControlName="startingMagicItems" />
          </mat-form-field>
          <mat-form-field appearance="outline" class="num-field">
            <mat-label>變化</mat-label>
            <input matInput type="number" formControlName="magicItemsChange" />
          </mat-form-field>
          <mat-form-field appearance="outline" class="num-field">
            <mat-label>合計</mat-label>
            <input matInput type="number" formControlName="magicItemsTotal" />
          </mat-form-field>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- 📝 冒險備註 -->
    <mat-card class="form-card">
      <mat-card-header><mat-card-title>📝 冒險備註</mat-card-title></mat-card-header>
      <mat-card-content>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>備註</mat-label>
          <textarea matInput formControlName="adventureNotes" rows="4"
            placeholder="自由填寫冒險備註..."></textarea>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>靈魂幣使用</mat-label>
          <input matInput formControlName="soulCoinChargesUsed" placeholder="自由文字" />
        </mat-form-field>
      </mat-card-content>
    </mat-card>

    <!-- Actions -->
    <div class="form-actions">
      <button type="button" mat-stroked-button (click)="onBack()">取消</button>
      <button type="submit" mat-flat-button color="primary" [disabled]="isSaving()">
        @if (isSaving()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          <mat-icon>save</mat-icon>
        }
        {{ isEditMode() ? '儲存變更' : '新增記錄' }}
      </button>
    </div>

  </form>
</div>
