# ==========================================
# D&D 冒險日誌系統 — Spring Boot 設定
# ==========================================

# 應用程式名稱
spring.application.name=dnd-adv-log-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# -------
# 資料庫連線（從環境變數讀取，本機開發請建立 application-local.properties）
# -------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------
# JPA / Hibernate
# -------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------
# 伺服器設定
# -------
server.port=8080

# -------
# CORS 設定（從環境變數讀取，預設允許本機前端）
# -------
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
